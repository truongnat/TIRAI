name: Release TIRAI CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI
        run: npm run check --workspace=tools/intelligent/tirai-cli

      - name: Pack CLI
        id: pack
        working-directory: tools/intelligent/tirai-cli
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match tirai-cli package version $PACKAGE_VERSION" >&2
              exit 1
            fi
          fi
          TGZ="$(npm pack --silent | tail -n 1)"
          sha256sum "$TGZ" > "$TGZ.sha256"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha=$TGZ.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tirai-cli-package
          path: |
            tools/intelligent/tirai-cli/${{ steps.pack.outputs.tgz }}
            tools/intelligent/tirai-cli/${{ steps.pack.outputs.sha }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tools/intelligent/tirai-cli/${{ steps.pack.outputs.tgz }}
            tools/intelligent/tirai-cli/${{ steps.pack.outputs.sha }}
